page:
  size: "A4"
  margins_inches: {top: 0.78, bottom: 0.78, left: 1.18, right: 0.59} # Поля: 2см, 2см, 3см, 1.5см

text_body:
  font: "Times New Roman"
  size: 12
  color: "000000"
  align: "justify" # ВАЖНО: Выравнивание по ширине для юр. документов
  line_spacing: 1.15
  indent_inches: 0.25 # Абзацный отступ (красная строка)
  space_after: 0

lists:
  bullet_marker: "—" # В договорах часто используют тире
  bibliography_hanging_indent: 0.0
  indent_inches: 0.25
  space_before: 0
  space_after: 0

styles:
  # Заголовки договора (например, "ДОГОВОР ПОСТАВКИ № 1")
  h1: {font: "Times New Roman", size: 14, bold: true, color: "000000", align: "center", space_before: 12, space_after: 12, page_break_before: false}
  
  # Разделы договора (например, "1. ТЕРМИНЫ И ОПРЕДЕЛЕНИЯ")
  h2: {font: "Times New Roman", size: 12, bold: true, color: "000000", align: "left", space_before: 12, space_after: 6}
  
  # Подразделы (например, "1.1. Стороны договорились...")
  h3: {font: "Times New Roman", size: 12, bold: false, italic: false, color: "000000", align: "left", space_before: 6, space_after: 6}
  
  link_color: "0000FF" 

  # Сноски для юридических документов
  footnotes:
    font: "Times New Roman"
    size: 10
    color: "000000"
    line_spacing: 1.0
    space_after: 2

  # Юридические таблицы (например, реквизиты сторон)
  table_font_size: 11
  table:
    padding_inches: {left: 0.05, right: 0.05, top: 0.05, bottom: 0.05}
    border_color: "000000" # Черные рамки (или BFBFBF для легкости)
    border_width_inner: 4
    border_width_outer: 4
    header_bg: "FFFFFF" # Белый фон без заливки, если нужно строго

  # Остальные стили можно оставить по умолчанию или удалить, если они не нужны
  toc:
    font: "Times New Roman"
    size: 12
    color: "000000"
    h1_bold: true
    indent_per_level: 0.25
    title_align: "center"